## CHECK STAGE

check_changelog:
  image: ${RELEASE_CLI_IMAGE}
  stage: check
  variables:
    # Full history and tags, so the whole pushed range can be inspected.
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - |
      # Check every commit pushed to master in this push, not only the last one.
      # CI_COMMIT_BEFORE_SHA is master's previous tip; it is all zeros for
      # pipelines not started by a push (web, API, schedule), so fall back to the
      # commits since the latest release tag.
      ZERO_SHA="0000000000000000000000000000000000000000"
      if [ -n "${CI_COMMIT_BEFORE_SHA}" ] && [ "${CI_COMMIT_BEFORE_SHA}" != "${ZERO_SHA}" ] \
        && git cat-file -e "${CI_COMMIT_BEFORE_SHA}^{commit}" 2>/dev/null; then
        BASE="${CI_COMMIT_BEFORE_SHA}"
      else
        BASE=$(git describe --tags --abbrev=0 "${CI_COMMIT_SHA}^" 2>/dev/null || true)
      fi

      if [ -n "${BASE}" ]; then
        RANGE="${BASE}..${CI_COMMIT_SHA}"
      else
        RANGE="${CI_COMMIT_SHA}^!"
      fi

      echo "Checking commits in ${RANGE} for CHANGELOG.md changes:"
      git log --oneline "${RANGE}"

      # Let git filter by path instead of piping into `grep -q`: grep exits on the
      # first match, git log then dies with SIGPIPE, and the runner's pipefail
      # turns that into a failed check. --full-history keeps commits from merged
      # branches that history simplification would otherwise skip.
      CHANGELOG_COMMITS=$(git log --full-history --format="%h %s" "${RANGE}" -- CHANGELOG.md)
      if [ -n "${CHANGELOG_COMMITS}" ]; then
        echo "CHANGELOG.md was modified in the pushed commits:"
        echo "${CHANGELOG_COMMITS}"
      else
        echo "CHANGELOG.md was not modified in any of the pushed commits."
        exit 1
      fi
  tags:
    - Docker
    - Centos9
    - IT4I_Network
  only:
    - master