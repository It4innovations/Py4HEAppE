## GENERATION STAGE

API_client_generation:
  stage: API_generation
  image: eclipse-temurin:11-jdk
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "main"'
  before_script:
    - |
      if [ -x "$(command -v dnf)" ]; then
        dnf -y install wget zip
      elif [ -x "$(command -v yum)" ]; then
        yum -y install wget zip
      else
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y --no-install-recommends wget zip
        rm -rf /var/lib/apt/lists/*
      fi
    - wget https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.26.0/openapi-generator-cli-7.26.0.jar -O /openapi-generator-cli.jar
  script:
    - |
      for VARIANT in sync async; do
        case "$VARIANT" in
          sync)  GEN_CONFIG=Tools/APIWrapperGen/config.json ;;
          async) GEN_CONFIG=Tools/APIWrapperGen/config_async.json ;;
        esac

        echo "Generating $VARIANT API client using $GEN_CONFIG"
        java -jar /openapi-generator-cli.jar generate \
          -i Tools/APIWrapperGen/swagger.json \
          -g python \
          -t Tools/APIWrapperGen/Templates/python/ \
          -o "./app/$VARIANT" \
          -c "$GEN_CONFIG" \
          || { echo "Generation failed for $VARIANT"; exit 1; }

        test -d "app/$VARIANT" || { echo "Generation did not produce app/$VARIANT"; exit 1; }
      done
    - cd app
    - zip -r ../APIWrapperGen.zip sync async
  tags:
    - Docker
    - Centos9
    - IT4I_Network
  artifacts:
    paths:
      - APIWrapperGen.zip
    expire_in: 1 days
